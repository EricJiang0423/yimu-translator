name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Core smoke tests
        run: bash scripts/test-direct.sh

      - name: Build CLI
        run: bash scripts/build-direct.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: game-translator
          path: .build/direct/game-translator
          if-no-files-found: error
