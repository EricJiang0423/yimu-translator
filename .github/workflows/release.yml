name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Smoke tests
        run: bash scripts/test-direct.sh

      - name: Build CLI
        run: bash scripts/build-direct.sh

      - name: Package CLI zip
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist/cli
          cp ".build/direct/game-translator" dist/cli/
          cp ".build/direct/libGameTranslatorCore.dylib" dist/cli/
          cat > dist/cli/run.sh <<'CLIEOF'
#!/bin/bash
cd "$(dirname "$0")"
# 自动移除 Gatekeeper 拦截标记（下载的二进制会带 quarantine）
if xattr -p com.apple.quarantine ./game-translator &>/dev/null 2>&1; then
    xattr -dr com.apple.quarantine ./game-translator 2>/dev/null
fi
exec ./game-translator
CLIEOF
          chmod +x dist/cli/run.sh dist/cli/game-translator
          ( cd dist/cli && ditto -c -k --sequesterRsrc --keepParent . "../yimu-translator-${V}.zip" )
          ( cd dist && shasum -a 256 "yimu-translator-${V}.zip" > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > dist/notes.md <<'EOF'
          **框住台词，即刻入戏。** macOS 游戏悬浮翻译工具：框选屏幕区域 → Apple Vision 本地 OCR → 腾讯云 TMT 翻译 → 悬浮层显示在原文上方。

          ## 使用方式

          下载 `yimu-translator-<版本>.zip`，解压后在终端运行：
          ```bash
          cd 解压目录
          chmod +x run.sh && ./run.sh
          ```
          首次需授权 Terminal.app 屏幕录制权限（一次授权，永久有效）。

          需自备腾讯云 TMT 的 SecretId / SecretKey。详细配置指南见 README。
          文件 SHA-256 见附件 `SHA256SUMS.txt`。
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          V="${{ steps.ver.outputs.version }}"
          ASSETS=( "dist/yimu-translator-${V}.zip" "dist/SHA256SUMS.txt" )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --title "译幕 $TAG" --notes-file dist/notes.md "${ASSETS[@]}"
          fi
