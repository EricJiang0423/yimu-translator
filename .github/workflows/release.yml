name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Smoke tests
        run: bash scripts/test-direct.sh

      - name: Build .app + DMG
        run: bash scripts/build-app.sh

      - name: Stage release assets
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist cli
          # DMG + .app zip (for .app/Homebrew users)
          cp ".build/app/译幕.dmg" "dist/yimu-translator-${V}.dmg"
          ditto -c -k --sequesterRsrc --keepParent ".build/app/译幕.app" "dist/yimu-translator-${V}-app.zip"
          # CLI zip (Terminal mode — recommended)
          cp ".build/app/译幕.app/Contents/MacOS/game-translator" cli/
          cp ".build/app/译幕.app/Contents/MacOS/libGameTranslatorCore.dylib" cli/
          cat > cli/run.sh <<'CLIEOF'
#!/bin/bash
cd "$(dirname "$0")"
./game-translator
CLIEOF
          chmod +x cli/run.sh cli/game-translator
          ( cd cli && ditto -c -k --sequesterRsrc --keepParent . "../dist/yimu-translator-${V}-cli.zip" )
          ( cd dist && shasum -a 256 yimu-translator-*.dmg yimu-translator-*.zip > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > dist/notes.md <<'EOF'
          **框住台词，即刻入戏。** macOS 游戏悬浮翻译工具：框选屏幕区域 → Apple Vision 本地 OCR → 腾讯云 TMT 翻译 → 悬浮层显示在原文上方。

          ## 使用方式

          **推荐（Terminal 模式，权限稳定）：**
          下载 `yimu-translator-<版本>-cli.zip`，解压后在终端运行：
          ```bash
          cd 解压目录
          chmod +x run.sh && ./run.sh
          ```
          首次需授权 Terminal.app 屏幕录制权限（一次授权，永久有效）。

          **备选（.app 模式）：**
          下载 DMG 安装到应用程序，或 `brew install --cask ericjiang0423/tap/yimu-translator`。

          首次使用需自备腾讯云 TMT 的 SecretId / SecretKey，在设置左栏填好后点「测试 API」验证。
          各文件 SHA-256 见附件 `SHA256SUMS.txt`。
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          V="${{ steps.ver.outputs.version }}"
          ASSETS=( "dist/yimu-translator-${V}.dmg" "dist/yimu-translator-${V}-app.zip" "dist/yimu-translator-${V}-cli.zip" "dist/SHA256SUMS.txt" )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --title "译幕 $TAG" --notes-file dist/notes.md "${ASSETS[@]}"
          fi
